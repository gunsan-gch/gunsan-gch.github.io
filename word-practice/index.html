<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="신입사원 문서 미션 · 한글 워드프로세서 실기 16개 조건을 그림과 체크리스트로 하나씩 완성해요.">
<title>신입사원 문서 미션 · 군산여상</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f3f5fa;--card:#fff;--ink:#1d2433;--muted:#667085;--line:#e3e7ef;
  --brand:#2f5bea;--brand-d:#1f43c0;--brand-l:#eaf0ff;
  --ok:#16a34a;--ok-l:#e7f7ec;--hi:#fff1a8;--hi-b:#f2b705;--red:#e5484d;--orange:#f97316;
  --r:16px;--sh:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html{font-size:var(--fs,16px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;line-height:1.55;word-break:keep-all;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,summary:focus-visible,label:focus-within{outline:3px solid #ffb020;outline-offset:2px;border-radius:8px}
img{max-width:100%;height:auto;display:block}
kbd{display:inline-block;font:inherit;font-size:.82em;font-weight:700;line-height:1.3;padding:1px 7px;margin:0 1px;border:1px solid #c9d1e0;border-bottom-width:3px;border-radius:6px;background:#fff;color:#27324a;white-space:nowrap}
.k{white-space:nowrap}
b{font-weight:800}
.hidden{display:none!important}

/* ── 상단 ── */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.topin{max-width:980px;margin:auto;padding:8px 16px 6px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:8px;min-width:0}
.logo .mark{width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:#fff;font-size:18px;flex:none}
.logo strong{font-size:1rem;letter-spacing:-.03em;white-space:nowrap}
.rank{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--brand-l);color:var(--brand-d);border-radius:999px;padding:4px 12px 4px 6px;font-size:.85rem;font-weight:800;white-space:nowrap}
.rank .em{width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:15px}
.tbtn{padding:7px 11px;border-radius:10px;font-size:.85rem;font-weight:700;background:#f1f3f8;white-space:nowrap}
.tbtn:hover{background:#e6eaf3}
.map{max-width:980px;margin:auto;padding:2px 16px 10px;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.map::-webkit-scrollbar{display:none}
.dot{flex:1 0 30px;max-width:46px;height:30px;border-radius:9px;background:#eef1f6;color:#7a869a;font-size:.78rem;font-weight:800;display:grid;place-items:center;position:relative;transition:.15s}
.dot:hover{background:#e2e7f1}
.dot.done{background:var(--ok);color:#fff}
.dot.cur{background:var(--brand);color:#fff;box-shadow:0 0 0 3px #b9c9ff}
.dot.done.cur{background:var(--ok);box-shadow:0 0 0 3px #a6e3b8}

/* ── 본문 ── */
main{max-width:980px;margin:auto;padding:18px 16px 110px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line)}
.head{display:flex;gap:14px;align-items:center;padding:18px 20px}
.num{flex:none;width:56px;height:56px;border-radius:16px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:1.6rem;font-weight:900;letter-spacing:-.04em}
.num.ok{background:var(--ok)}
.head h1{margin:0;font-size:1.5rem;letter-spacing:-.04em;line-height:1.25}
.head p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.head .tag{margin-left:auto;align-self:flex-start;font-size:.75rem;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--ok-l);color:var(--ok)}

main:focus{outline:none}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-rows:auto auto 1fr;grid-template-areas:"a b" "x b" "h b";gap:14px;margin-top:14px;align-items:start}
.grid>.card{padding:16px}
.ga{grid-area:a}.gb{grid-area:b}.gx{grid-area:x}.gh{grid-area:h}
.grid .extra,.grid .help{margin-top:0}
.grid .dls{grid-template-columns:1fr}
.lab{display:flex;align-items:center;gap:7px;font-size:.8rem;font-weight:900;letter-spacing:.02em;color:var(--muted);margin:0 0 10px}
.lab i{font-style:normal;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:.75rem}
.lab .l1{background:#7c3aed}.lab .l2{background:var(--orange)}.lab .l3{background:var(--brand)}.lab .l4{background:var(--ok)}

/* 완성 모습 */
.goal{display:grid;gap:8px}
.goal button{display:block;width:100%;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff;position:relative}
.goal button::after{content:"🔍 크게";position:absolute;right:6px;bottom:6px;background:rgba(29,36,51,.75);color:#fff;font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:6px;opacity:0;transition:.15s}
.goal button:hover::after{opacity:1}
.goal img{width:100%;height:auto}
.goal.tall img{max-height:300px;object-fit:cover;object-position:top}

/* 김 대리 */
.mascot{display:flex;align-items:flex-end;gap:4px;margin-top:12px}
.mascot img{width:74px;height:auto;flex:none}
.bubble{position:relative;background:#fff8d6;border:2px solid #ffd84d;border-radius:14px;padding:9px 12px;font-size:.92rem;font-weight:600}
.bubble::before{content:"";position:absolute;left:-9px;bottom:14px;border:8px solid transparent;border-right-color:#ffd84d;border-left:0}
.bubble small{display:block;font-size:.72rem;font-weight:900;color:#a16207;margin-bottom:1px}

/* 메뉴 경로 */
.paths{display:grid;gap:8px}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:.88rem}
.path .seg{background:#fff;border:1px solid #d6dcea;border-radius:8px;padding:4px 9px;font-weight:700}
.path .seg:first-child{background:#e9efff;border-color:#c7d4ff;color:var(--brand-d)}
.path .arr{color:#98a2b3;font-weight:900}
.path .or{font-size:.75rem;color:var(--muted);margin-left:4px}

/* 가짜 대화상자 */
.dlg{border:1px solid #c9d1e0;border-radius:10px;overflow:hidden;background:#f7f8fb;box-shadow:0 6px 18px rgba(30,40,70,.10);margin-bottom:12px}
.dlg:last-child{margin-bottom:0}
.dlg .bar{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#f4f6fb,#e6eaf3);padding:7px 11px;font-size:.85rem;font-weight:800;border-bottom:1px solid #d3d9e6}
.dlg .bar span{color:#8a94a6;font-weight:400}
.dlg .tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid #d3d9e6;background:#eef1f7;overflow-x:auto;scrollbar-width:none}
.dlg .tab{font-size:.75rem;padding:4px 9px;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;color:#667085;white-space:nowrap}
.dlg .tab.on{background:#f7f8fb;border-color:#d3d9e6;color:var(--ink);font-weight:800;margin-bottom:-1px}
.dlg .body{padding:10px 11px;display:grid;gap:6px}
.dlg .sec{font-size:.72rem;font-weight:900;color:#5b6b88;margin-top:4px;display:flex;align-items:center;gap:6px}
.dlg .sec::after{content:"";flex:1;height:1px;background:#d9dfea}
.fld{display:grid;grid-template-columns:minmax(78px,38%) 1fr;align-items:center;gap:8px;font-size:.84rem}
.fld .fl{color:#556178;text-align:right;line-height:1.25}
.fld .fv{display:flex;align-items:center;gap:7px;background:var(--hi);border:1.5px solid var(--hi-b);border-radius:6px;padding:4px 8px;font-weight:800;line-height:1.3;min-height:30px}
.sw{width:18px;height:18px;border-radius:4px;border:1px solid rgba(0,0,0,.25);flex:none}
.chk{width:16px;height:16px;border-radius:4px;background:var(--brand);color:#fff;display:inline-grid;place-items:center;font-size:11px;flex:none}
.chk.off{background:#fff;border:1.5px solid #98a2b3}
.dlg .foot{display:flex;justify-content:flex-end;gap:6px;padding:0 11px 10px}
.dlg .foot span{font-size:.75rem;padding:4px 14px;border-radius:6px;border:1px solid #c9d1e0;background:#fff}
.dlg .foot span:first-child{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:800}

/* 체크리스트 */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.step{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;transition:.15s;font-size:.97rem;user-select:none}
.step:hover{border-color:#b9c7f5;background:#fafbff}
.step .box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid #b6bfd0;display:grid;place-items:center;font-weight:900;font-size:.85rem;color:#8a94a6;background:#fff;transition:.15s}
.step.on{border-color:#9ddbb2;background:var(--ok-l)}
.step.on .box{background:var(--ok);border-color:var(--ok);color:#fff}
.step.on .tx{color:#3d6b4f}
.step .tx{padding-top:1px}
.stepnote{font-size:.8rem;color:var(--muted);margin:8px 2px 0}

/* 막혔어요 */
.help{margin-top:14px;padding:6px 16px}
.help summary{cursor:pointer;font-weight:800;padding:8px 0;list-style:none;display:flex;align-items:center;gap:8px}
.help summary::-webkit-details-marker{display:none}
.help summary::before{content:"🆘";}
.help summary::after{content:"펼치기 ▾";margin-left:auto;font-size:.78rem;color:var(--muted);font-weight:600}
.help[open] summary::after{content:"접기 ▴"}
.qa{border-top:1px dashed var(--line);padding:9px 0;font-size:.9rem}
.qa b{display:block;color:#b42318;font-weight:800}
.qa b::before{content:"Q. "}
.qa span::before{content:"→ ";color:var(--ok);font-weight:900}

/* 부가 자료 */
.extra{margin-top:14px;padding:16px}
.xhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.xhead h2{margin:0;font-size:1rem}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;font-weight:800;font-size:.86rem;background:var(--brand-l);color:var(--brand-d);text-decoration:none;white-space:nowrap}
.btn:hover{background:#dbe5ff}
.copyzone{background:#f6f7fb;border:1px dashed #cfd6e4;border-radius:10px;padding:10px 12px;white-space:pre-wrap;font-size:.9rem}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{background:#76458c;color:#fff;font-weight:700;padding:6px}
.tbl td{padding:6px;border-bottom:1px solid #e3e7ef;text-align:center}
.tbl td.r{text-align:right;padding-right:14px}
.tbl tr.sum td{background:#d9d9d9;border-top:3px double #555;font-weight:800}
.tbl td.pick{background:#dbe5ff;outline:2px solid var(--brand);outline-offset:-2px}
.tbl td.res{background:var(--hi);outline:2px dashed var(--hi-b);outline-offset:-2px}
.dls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dl{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-decoration:none;color:inherit;background:#fff;font-weight:800;font-size:.88rem}
.dl:hover{border-color:#b9c7f5;background:#fafbff}
.dl .ic{font-size:1.4rem}
.dl small{display:block;font-weight:500;color:var(--muted);font-size:.74rem}
.splitdemo{display:grid;grid-template-columns:1fr 1fr;gap:6px;border:2px solid #1d2433;border-radius:10px;padding:6px;background:#1d2433;max-width:320px}
.splitdemo div{background:#fff;border-radius:5px;height:70px;display:grid;place-items:center;font-size:.78rem;font-weight:800;text-align:center;line-height:1.3}
.splitdemo div:last-child{background:#e9efff;color:var(--brand-d)}

/* 시작 화면 */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:16px;align-items:center;padding:22px;background:linear-gradient(135deg,#2f5bea,#5b7cf7 60%,#7aa0ff);color:#fff;border:0;overflow:hidden;position:relative}
.hero small{font-weight:800;opacity:.85;letter-spacing:.04em}
.hero h1{margin:4px 0 6px;font-size:1.65rem;line-height:1.3;letter-spacing:-.04em}
.hero p{margin:0;opacity:.95}
.hero .thumb{background:#fff;border-radius:8px;padding:4px;transform:rotate(3deg);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.hero .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hero .chips span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700}
.ranks{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ranks span{font-size:.78rem;background:#f1f3f8;border-radius:999px;padding:3px 9px;font-weight:700;color:#475467}
.ranks span.me{background:var(--brand);color:#fff}

/* 수료증 */
.cert{padding:26px;text-align:center;background:#fffdf5;border:3px double #c9a227;position:relative;overflow:hidden}
.cert h1{margin:0;font-size:1.6rem;letter-spacing:.1em}
.cert .big{font-size:3rem;font-weight:900;color:var(--brand);line-height:1.1;margin:10px 0 2px}
.stamps{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-width:440px;margin:16px auto 6px}
.stamps span{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:900;border:2px dashed #d0d5dd;color:#98a2b3}
.stamps span.ok{border:2px solid var(--red);color:var(--red);transform:rotate(-12deg);background:#fff5f5}

/* 하단 바 */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);border-top:1px solid var(--line);backdrop-filter:blur(6px)}
.bin{max-width:980px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.bprev{padding:11px 16px;border-radius:12px;background:#f1f3f8;font-weight:800}
.bprev:disabled{opacity:.4;cursor:default}
.meter{flex:1;display:flex;align-items:center;gap:8px;min-width:0;font-size:.85rem;color:var(--muted);font-weight:700}
.meter .bar{flex:1;height:8px;border-radius:9px;background:#e8ebf2;overflow:hidden;max-width:220px}
.meter .bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .25s}
.bnext{padding:12px 20px;border-radius:12px;font-weight:900;background:#e8ebf2;color:#475467;white-space:nowrap}
.bnext.go{background:var(--ok);color:#fff;box-shadow:0 6px 16px rgba(22,163,74,.35);animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}

/* 도장 · 축하 */
.stamp{position:fixed;inset:0;z-index:60;display:grid;place-items:center;pointer-events:none}
.stamp div{width:190px;height:190px;border-radius:50%;border:8px solid var(--red);color:var(--red);display:grid;place-items:center;text-align:center;font-size:2.2rem;font-weight:900;line-height:1.1;background:rgba(255,255,255,.88);animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both;transform:rotate(-14deg)}
.stamp div small{display:block;font-size:.9rem}
@keyframes stamp{from{transform:scale(2.6) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-14deg);opacity:1}}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
dialog{border:0;border-radius:18px;padding:0;max-width:min(860px,calc(100vw - 24px));width:100%;max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.3);color:var(--ink)}
#upDlg{max-width:min(420px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(17,24,39,.55)}
.dh{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:1.05rem}
.db{padding:16px}
.zoom{overflow:auto;max-height:75vh;background:#eef1f6;border-radius:10px}
.zoom img{width:100%;max-width:none;transition:width .15s}
.up{text-align:center;padding:26px 22px}
.up img{width:150px;margin:0 auto 6px}
.up h2{margin:0;font-size:1.5rem}
.up .r{font-size:2.4rem;font-weight:900;color:var(--brand);margin:6px 0}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.9rem;align-items:center}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:12px;font-size:.88rem;font-weight:700;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25)}

@media(max-width:760px){
  .grid{grid-template-columns:1fr;grid-template-rows:auto;grid-template-areas:"a" "b" "x" "h"}
  .hero{grid-template-columns:1fr}
  .hero .thumb{display:none}
  .dls{grid-template-columns:1fr}
  .logo strong{display:none}
  .head h1{font-size:1.3rem}
  .num{width:48px;height:48px;font-size:1.35rem}
  .meter .bar{display:none}
}
@media(max-width:420px){
  main{padding:14px 12px 110px}
  .topin,.map,.bin{padding-left:12px;padding-right:12px}
  .bnext{padding:12px 14px}
  .tbtn.fs{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="logo"><span class="mark" aria-hidden="true">📄</span><strong>신입사원 문서 미션</strong></div>
    <div class="rank" id="rank" title="완료한 조건 수에 따라 승진해요"></div>
    <button class="tbtn" id="goalBtn">🖼 완성 예시</button>
    <button class="tbtn fs" id="fsDown" aria-label="글자 작게">가−</button>
    <button class="tbtn fs" id="fsUp" aria-label="글자 크게">가+</button>
    <button class="tbtn" id="helpBtn" aria-label="도움말">?</button>
  </div>
  <nav class="map" id="map" aria-label="조건 바로 가기"></nav>
</header>

<main id="main" tabindex="-1"></main>

<footer class="bottom">
  <div class="bin">
    <button class="bprev" id="prev">←</button>
    <div class="meter"><span id="meterText"></span><span class="bar"><i id="meterBar"></i></span></div>
    <button class="bnext" id="next"></button>
  </div>
</footer>

<dialog id="goalDlg" aria-labelledby="goalTitle">
  <div class="dh"><h2 id="goalTitle">완성 예시 (조건 번호 표시)</h2>
    <div><button class="tbtn" data-z="-25">−</button> <button class="tbtn" data-z="25">+</button> <button class="tbtn" data-close>닫기 ✕</button></div></div>
  <div class="db"><div class="zoom"><img id="goalImg" src="img/goal.webp" alt="조건 번호가 표시된 완성 문서 예시" width="1300" height="1837"></div></div>
</dialog>

<dialog id="helpDlg" aria-labelledby="helpTitle">
  <div class="dh"><h2 id="helpTitle">도움말</h2><button class="tbtn" data-close>닫기 ✕</button></div>
  <div class="db">
    <p style="margin-top:0"><b>한글 창을 한 번 클릭</b>한 다음 단축키를 누르세요.</p>
    <div class="keys">
      <span><kbd>Ctrl</kbd>+<kbd>Z</kbd></span><span>되돌리기 (실수했을 때 제일 먼저!)</span>
      <span><kbd>Ctrl</kbd>+<kbd>S</kbd></span><span>저장</span>
      <span><kbd>Alt</kbd>+<kbd>L</kbd></span><span>글자 모양</span>
      <span><kbd>Alt</kbd>+<kbd>T</kbd></span><span>문단 모양</span>
      <span><kbd>F6</kbd></span><span>스타일</span>
      <span><kbd>F7</kbd></span><span>편집 용지</span>
      <span><kbd>F5</kbd></span><span>표 안에서 셀 블록 선택</span>

function pathHTML(p){
  const keyLike=s=>/^(F\d+|[A-Z]|Ctrl.*|Alt.*|Shift.*)$/.test(s);
  const segs=p.filter(s=>!keyLike(s)),key=p.find(keyLike);
  return `<div class="path">${segs.map(s=>`<span class="seg">${s}</span>`).join('<span class="arr">›</span>')}${key?`<span class="or">또는 ${K(key)}</span>`:''}</div>`;
}
function fieldVal(v,sw){
  let pre='';
  if(v.startsWith(ON)){pre='<span class="chk">✓</span>';v=v.slice(1).trim()}
  else if(v.startsWith(OFF)){pre='<span class="chk off"></span>';v=v.slice(1).trim()}
  if(sw)pre=`<span class="sw" style="background:${sw}"></span>`;
  return pre+v;
}
function dlgHTML(d){
  const on=d.on||d.tabs.slice(0,1);
  return `<div class="dlg" role="img" aria-label="${d.t} 설정 창 그림"><div class="bar">${d.t}<span>✕</span></div>
  ${d.tabs.length?`<div class="tabs">${d.tabs.map(t=>`<span class="tab ${on.includes(t)?'on':''}">${t}</span>`).join('')}</div>`:''}
  <div class="body">${d.rows.map(r=>r[0][0]==='#'?`<div class="sec">${r[0].slice(1)}</div>`:`<div class="fld"><span class="fl">${r[0]}</span><span class="fv">${fieldVal(r[1],r[2])}</span></div>`).join('')}</div>
  <div class="foot"><span>설정</span><span>취소</span></div></div>`;
}
function stepsHTML(i,m){
  const t=ticks(i);
  return `<ol class="steps">${m.steps.map((s,j)=>`<li class="step ${t[j]?'on':''}" data-step="${j}" role="checkbox" aria-checked="${!!t[j]}" tabindex="0"><span class="box">${t[j]?'✓':j+1}</span><span class="tx">${s}</span></li>`).join('')}</ol>
  <p class="stepnote">한글에서 한 동작 하고 → 여기서 한 줄 체크!</p>`;
}
function mascot(tip){return `<div class="mascot"><img src="img/mascot.webp" alt="" width="482" height="360"><div class="bubble"><small>김 대리의 꿀팁</small>${tip}</div></div>`}

function tableHTML(mode){
  const rows=[[2020,38.33,556,6.89],[2021,44.58,562,7.93],[2022,48.22,561.2,8.59],[2023,53.49,560.7,9.54]];

    ?`<tr class="sum"><td>합계</td><td class="r res">184.62</td><td class="r res">2,239.9</td><td></td></tr>`
    :`<tr class="sum"><td>합계</td><td class="r">(계산식)</td><td class="r">(계산식)</td><td></td></tr>`;
  return `<table class="tbl"><thead><tr><th>구분</th><th>자급제 사용자</th><th>전체 가입자</th><th>비중</th></tr></thead><tbody>${r.map(x=>`<tr><td>${x[0]}</td><td class="r ${mode==='sum'?'pick':''}">${x[1]}</td><td class="r ${mode==='sum'?'pick':''}">${x[2]}</td><td>${x[3]}</td></tr>`).join('')}${sum}</tbody></table>`;
}

  if(i===0){
    const n=doneCount(),r=rankOf(n);
    html+=`<section class="card hero"><div><small>상공일보 · 입사 첫날</small><h1>신입사원 님,<br>첫 보고서를 완성해 주세요!</h1><p>16개 업무를 하나씩 끝낼 때마다 <b>결재 도장</b>을 받고 <b>승진</b>해요.</p>

      <button class="thumb" data-goal aria-label="완성 예시 크게 보기"><img src="img/goal-thumb.webp" alt="완성 문서 미리 보기" width="420" height="594"></button></section>
      <div class="ranks" aria-label="승진 단계">${RANKS.map(x=>`<span class="${x===r?'me':''}">${x[2]} ${x[1]}${x[0]?` · ${x[0]}개`:''}</span>`).join('')}</div>`;
  }
  html+=`<section class="card head" style="margin-top:${i===0?14:0}px"><div class="num ${done?'ok':''}">${i===0?'🏢':i===17?'🏆':String(i).padStart(2,'0')}</div>
    <div><h1>${i>=1&&i<=16?`${m.icon} `:''}${m.title}</h1><p>${m.sub}</p></div>${done?'<span class="tag">✔ 결재 완료</span>':''}</section>`;
  const left=`<div class="card ga"><p class="lab"><i class="l1">①</i>${i===0||i===17?'오늘 완성할 문서':'완성하면 이렇게!'}</p>${imgs?`<div class="goal ${m.tall?'tall':''}">${imgs}</div>`:''}${mascot(m.tip)}
    <p class="lab" style="margin-top:16px"><i class="l2">②</i>어디서? (한글 메뉴)</p><div class="paths">${m.paths.map(pathHTML).join('')}</div></div>`;
  const right=`<div class="card gb"><p class="lab"><i class="l4">③</i>한 줄씩 하고 체크</p>${stepsHTML(i,m)}

  html+=`<div class="grid">${left}${right}${i!==17&&m.extra?extraHTML(m.extra):''}${help}</div>`;
  $('#main').innerHTML=html;
  // 상단 지도
  $('#map').innerHTML=M.map((x,j)=>`<button class="dot ${S.done[j]?'done':''} ${j===i?'cur':''}" data-go="${j}" title="${j}. ${x.title}" aria-label="${j}. ${x.title}${S.done[j]?' 완료':''}">${j===0?'🏢':j===17?'🏆':S.done[j]&&j!==i?'✓':j}</button>`).join('');
  const cur=$('#map .cur');if(cur)cur.scrollIntoView({block:'nearest',inline:'center'});
  const n=doneCount(),r=rankOf(n);
  $('#rank').innerHTML=`<span class="em">${r[2]}</span>${r[1]} · ${n}/16`;
  bottom();save();
}
function bottom(){
  const i=S.cur,m=M[i],t=ticks(i),c=m.steps.filter((_,j)=>t[j]).length,all=c===m.steps.length;
  $('#prev').disabled=i===0;
  $('#meterText').textContent=`체크 ${c}/${m.steps.length}`;
  $('#meterBar').style.width=(c/m.steps.length*100)+'%';
  const nb=$('#next');
  if(i===M.length-1){nb.textContent=all?'🎉 제출 완료!':'체크하고 제출';nb.className='bnext'+(all?' go':'')}
  else if(S.done[i]){nb.textContent='다음 →';nb.className='bnext go'}
  else if(all){nb.textContent=i===0?'출근 완료! 시작 →':'결재 받기 →';nb.className='bnext go'}
  else{nb.textContent='건너뛰기 →';nb.className='bnext'}
}
function go(i){S.cur=Math.min(M.length-1,Math.max(0,i));render();window.scrollTo({top:0});$('#main').focus({preventScroll:true})}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),2000)}
function confetti(n=70){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#2f5bea','#16a34a','#f97316','#ffd700','#e5484d','#7c3aed'];
  for(let j=0;j<n;j++){const d=document.createElement('i');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[j%cols.length];d.style.animationDuration=(1.6+Math.random()*1.6)+'s';d.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3800)}
}
function stamp(text,sub){const s=document.createElement('div');s.className='stamp';s.innerHTML=`<div><span>${text}<small>${sub}</small></span></div>`;document.body.appendChild(s);setTimeout(()=>s.remove(),900)}

$('#main').addEventListener('click',e=>{
  const st=e.target.closest('[data-step]');
  if(st){const t=ticks(S.cur),j=+st.dataset.step;t[j]=!t[j];st.classList.toggle('on',t[j]);st.setAttribute('aria-checked',t[j]);st.querySelector('.box').textContent=t[j]?'✓':j+1;bottom();save();return}
  if(e.target.closest('[data-goal]')){openGoal();return}
  const cp=e.target.closest('[data-copy]');if(cp){copy(cp.dataset.copy);return}
  const sp=e.target.closest('.stamps span');if(sp){go([...sp.parentNode.children].indexOf(sp)+1)}
});
$('#main').addEventListener('keydown',e=>{const st=e.target.closest('[data-step]');if(st&&(e.key===' '||e.key==='Enter')){e.preventDefault();st.click()}});
$('#map').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(+b.dataset.go)});
$('#prev').onclick=()=>go(S.cur-1);
let busy=false;
$('#next').onclick=()=>{
  if(busy)return;
  const i=S.cur,m=M[i],t=ticks(i),all=m.steps.every((_,j)=>t[j]);
  if(i===M.length-1){if(all){S.done[i]=true;stamp('제출','완료');confetti(120);render()}else toast('체크를 모두 하면 제출할 수 있어요');return}
  if(all&&!S.done[i]){
    const before=rankOf(doneCount());S.done[i]=true;const after=rankOf(doneCount());
    if(i===0){stamp('출근','완료')}else stamp('결재','완료');
    busy=true;setTimeout(()=>{busy=false;go(i+1);if(after!==before)rankUp(after)},650);return;
  }
  go(i+1);
};
function rankUp(r){
  $('#upBody').innerHTML=`<img src="img/mascot.webp" alt="" width="482" height="360"><h2>승진을 축하합니다!</h2><div class="r">${r[2]} ${r[1]}</div><p>벌써 ${doneCount()}개 업무를 해냈어요. 계속 가 볼까요?</p><button class="bnext go" data-close style="margin-top:8px">계속하기 →</button>`;
  $('#upDlg').showModal();confetti();
}
async function copy(key){
  try{await navigator.clipboard.writeText(COPY[key]);toast('복사 완료! 한글에서 Ctrl+V')}
  catch(e){toast('복사가 안 돼요. 직접 보고 입력해 주세요')}
}
let zoom=100;
function openGoal(){zoom=100;$('#goalImg').style.width='100%';$('#goalDlg').showModal()}
document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{zoom=Math.max(50,Math.min(250,zoom+ +b.dataset.z));$('#goalImg').style.width=zoom+'%'});
document.addEventListener('click',e=>{if(e.target.closest('[data-close]')){e.target.closest('dialog').close()}});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));
$('#goalBtn').onclick=openGoal;
$('#helpBtn').onclick=()=>{$('#dlsHelp').innerHTML=DLS;$('#helpDlg').showModal()};
$('#fsUp').onclick=()=>{S.fs=Math.min(20,S.fs+1);render()};
$('#fsDown').onclick=()=>{S.fs=Math.max(14,S.fs-1);render()};
$('#resetBtn').onclick=()=>{if(confirm('체크와 완료 기록을 모두 지울까요?')){S={cur:0,tick:{},done:{},fs:S.fs};$('#helpDlg').close();go(0)}};
render();
</script>
</body>
</html>
